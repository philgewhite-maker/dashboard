plugins {
    id 'com.android.application'
}

android {
    namespace 'com.philgewhite.dashboardcapture'
    compileSdk 35

    defaultConfig {
        applicationId 'com.philgewhite.dashboardcapture'
        minSdk 30
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    // The key and its password come from build.ps1 via the environment, so
    // neither is ever in the (public) repo. Without them a release build
    // still works, signed with the local debug key instead.
    signingConfigs {
        release {
            def ks = System.getenv('RELAY_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('RELAY_KEYSTORE_PASSWORD')
                keyAlias 'relay'
                keyPassword System.getenv('RELAY_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('RELAY_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
